services:
  kokoro:
    image: hwdsl2/kokoro-server:cuda
    container_name: kokoro
    restart: always
    # Docker Desktop for Linux runs in a VM without NVIDIA GPU passthrough.
    # Start this compose file on the native Docker Engine (`--context default`).
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-0}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      KOKORO_DISABLE_USAGE_COUNTS: "1"
    ports:
      - "127.0.0.1:8880:8880/tcp"
    volumes:
      - kokoro-data:/var/lib/kokoro
      - ./kokoro.env:/kokoro.env:ro

volumes:
  kokoro-data:
    name: kokoro-data
